print_info() {
    prin "$(color {{colors.primary.default.hex}})nick$(color {{colors.secondary.default.hex}})@$(color {{colors.primary.default.hex}})zernyshkin"
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory

    # Выносим в переменные, чтобы bash не путался во вложенных скобках $(...)
    disk_root=$(df -h / | awk 'NR==2 {print $3, "/", $2, "("$5")"}')
    disk_home=$(df -h /home | awk 'NR==2 {print $3, "/", $2, "("$5")"}')

    prin "Disk (/)" "$disk_root"
    prin "Disk (/home)" "$disk_home"

    info cols
}

title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="off"
memory_unit="mib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
refresh_rate="off"
de_version="on"

# ANSI-коды для цветных блоков (neofetch не понимает тут hex)
colors=(2 0 5 4 1 7)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1

image_backend="ascii"
image_source="auto"
ascii_distro="auto"
ascii_colors=(2 5)
ascii_bold="on"

gap=3
yoffset=0
xoffset=0
background_color=
stdout="off"
