general {
    lock_cmd = pidof quickshell ipc call lockscreen lock || quickshell ipc call lockscreen lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on 
}

# 1. ЗА ТЕМНЕНИЕ (Эффект Android за 30 секунд до блокировки)
listener {
    timeout = 90                                 # 90 секунд (за 30 сек до таймаута в 120 сек)
    on-timeout = brightnessctl -s set 30%-        # Сохранить текущую яркость и поставить 10%
    on-resume  = brightnessctl -r                # Восстановить яркость, если пошевелили мышью
}

# 2. БЛОКИРОВКА ЭКРАНА
listener {
    timeout = 120                                # 2 минуты
    on-timeout = quickshell ipc call lockscreen lock
}

# 3. ВЫКЛЮЧЕНИЕ ЭКРАНА (DPMS)
listener {
    timeout = 180                                # 3 минуты
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 4. СОН (SUSPEND)
listener {
    timeout = 300                                # 5 минут
    on-timeout = systemctl suspend
}
